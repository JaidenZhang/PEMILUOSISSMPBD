<!DOCTYPE html>
<html lang="id">
<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Hasil Pemilihan OSIS</title>

    <link rel="stylesheet" href="style.css">

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

</head>

<body class="result-page">

    <!-- BACKGROUND ANIMATION -->

    <div class="background-animation">

        <div class="bg-orb orb-1"></div>
        <div class="bg-orb orb-2"></div>
        <div class="bg-orb orb-3"></div>

        <div class="bg-grid"></div>

    </div>


    <!-- HEADER -->

    <header class="header result-enter enter-1">

        <div>
            <h1>Hasil Pemilihan OSIS</h1>

            <p>
                Perolehan suara sementara
            </p>
        </div>


        <div class="header-actions">

            <div class="live-indicator">

                <span class="live-dot"></span>

                LIVE

            </div>


            <a
                href="index.html"
                class="result-btn"
            >
                Kembali Menu
            </a>

        </div>

    </header>


    <main class="container result-container">


        <!-- HERO -->

        <section class="hero result-enter enter-2">

            <span class="badge">

                <span class="badge-live-dot"></span>

                LIVE RESULT

            </span>


            <h2>
                Grafik Perolehan Suara
            </h2>


        


            <div class="update-status">

                <span class="update-dot"></span>

                <span id="updateText">
                    Menghubungkan ke data...
                </span>

            </div>

        </section>



        <!-- GRAPH -->

        <section
            class="result-card result-enter enter-3"
        >

            <div class="chart-header">

                <div>

                    <span class="chart-label">
                        PEROLEHAN SUARA
                    </span>



                </div>


                <div class="refresh-indicator">

                    <span class="refresh-circle"></span>

                    Auto refresh

                </div>

            </div>


            <div class="chart-wrapper">

                <canvas id="voteChart"></canvas>

            </div>

        </section>



        <!-- SUMMARY -->

        <section
            class="vote-summary result-enter enter-4"
        >


            <div
                class="summary-card"
                id="card1"
            >

                <span class="summary-number">
                    01
                </span>

                <span>
                    Paslon 1
                </span>

                <strong id="vote1">
                    0
                </strong>

                <small>
                    Suara
                </small>

            </div>



            <div
                class="summary-card"
                id="card2"
            >

                <span class="summary-number">
                    02
                </span>

                <span>
                    Paslon 2
                </span>

                <strong id="vote2">
                    0
                </strong>

                <small>
                    Suara
                </small>

            </div>



            <div
                class="summary-card"
                id="card3"
            >

                <span class="summary-number">
                    03
                </span>

                <span>
                    Paslon 3
                </span>

                <strong id="vote3">
                    0
                </strong>

                <small>
                    Suara
                </small>

            </div>



            <div
                class="summary-card"
                id="card4"
            >

                <span class="summary-number">
                    04
                </span>

                <span>
                    Paslon 4
                </span>

                <strong id="vote4">
                    0
                </strong>

                <small>
                    Suara
                </small>

            </div>


        </section>


        <div class="last-update">

            Terakhir diperbarui

            <span id="lastUpdate">
                ...
            </span>

        </div>


    </main>


    <script src="app.js"></script>


    <script>

        let previousVotes = [
            null,
            null,
            null,
            null
        ];


        function animateVoteChange(
            index,
            newValue
        ) {

            const number =
                document.getElementById(
                    `vote${index + 1}`
                );


            const card =
                document.getElementById(
                    `card${index + 1}`
                );


            if (!number || !card) {
                return;
            }


            if (
                previousVotes[index] !== null &&
                previousVotes[index] !== newValue
            ) {

                number.classList.remove(
                    "vote-change"
                );

                card.classList.remove(
                    "card-change"
                );


                void number.offsetWidth;


                number.classList.add(
                    "vote-change"
                );

                card.classList.add(
                    "card-change"
                );


                setTimeout(() => {

                    number.classList.remove(
                        "vote-change"
                    );

                    card.classList.remove(
                        "card-change"
                    );

                }, 900);

            }


            previousVotes[index] =
                newValue;

        }



        /*
        ========================================
        UPDATE STATUS
        ========================================
        */

        function updateLiveStatus() {

            const now =
                new Date();


            const time =
                now.toLocaleTimeString(
                    "id-ID",
                    {
                        hour: "2-digit",
                        minute: "2-digit",
                        second: "2-digit"
                    }
                );


            document.getElementById(
                "lastUpdate"
            ).textContent = time;


            document.getElementById(
                "updateText"
            ).textContent =
                "Data terhubung";


            const dot =
                document.querySelector(
                    ".update-dot"
                );


            if (dot) {

                dot.classList.add(
                    "connected"
                );

            }

        }



        /*
        ========================================
        OBSERVER ANGKA
        ========================================
        */

        for (
            let i = 1;
            i <= 4;
            i++
        ) {

            const element =
                document.getElementById(
                    `vote${i}`
                );


            if (!element) {
                continue;
            }


            const observer =
                new MutationObserver(() => {

                    const value =
                        Number(
                            element.textContent
                        );


                    animateVoteChange(
                        i - 1,
                        value
                    );


                    updateLiveStatus();

                });


            observer.observe(
                element,
                {
                    childList: true,
                    characterData: true,
                    subtree: true
                }
            );

        }

        setTimeout(() => {

            updateLiveStatus();

        }, 1200);


    </script>

</body>
</html>
